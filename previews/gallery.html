4px 4px 0 rgba(17,17,17,.85);\n  transform: rotate(.25deg);\n}\n:root[data-theme=\"urban-collage\"] .loki-bubble-user {\n  border: 2px solid #111; border-radius: 0;\n  box-shadow: 4px 4px 0 rgba(17,17,17,.85);\n  transform: rotate(-.3deg);\n  background: #b8ef31;\n}\n:root[data-theme=\"urban-collage\"] .loki-composer {\n  border: 2px solid #111; border-radius: 0;\n  box-shadow: 5px 5px 0 rgba(17,17,17,.9);\n}\n:root[data-theme=\"urban-collage\"] .loki-composer:focus-within { box-shadow: 0 0 0 2px #b8ef31, 5px 5px 0 rgba(17,17,17,.9); }\n:root[data-theme=\"urban-collage\"] .loki-chat-sidebar .loki-button-primary {\n  background: #111111; color: #b8ef31;\n  border: 2px solid #111111; border-radius: 0;\n  box-shadow: 3px 3px 0 rgba(17,17,17,.5);\n}\n:root[data-theme=\"urban-collage\"] .loki-chat-sidebar .loki-button-primary:hover { background: #b8ef31; color: #111111; }\n:root[data-theme=\"urban-collage\"] .loki-context-panel {\n  background: #f2ecdc;\n  border-left: 2px solid #111;\n}\n:root[data-theme=\"urban-collage\"] .loki-composer .loki-button-primary {\n  background: #b8ef31; color: #111;\n  border: 2px solid #111; border-radius: 0;\n  box-shadow: 3px 3px 0 rgba(17,17,17,.85);\n}\n:root[data-theme=\"urban-collage\"] .loki-composer .loki-button-primary:hover { filter: brightness(1.06); }\n:root[data-theme=\"urban-collage\"] .loki-composer .loki-button-primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(17,17,17,.85); }\n:root[data-theme=\"urban-collage\"] .loki-sidebar nav {\n  padding-block: 6px;\n  gap: 3px;\n}\n:root[data-theme=\"urban-collage\"] .loki-sidebar::after {\n  margin: .45rem .85rem .55rem;\n  padding: .3rem .55rem;\n}\n:root[data-theme=\"urban-collage\"] .loki-sidebar .loki-nav-item { padding-block: 4px; }\n"}];
const KEY = "loki-theme-kit:selected";
// 第一次打开：默认勾上作者推荐的那几套（★），之后以你自己的选择为准
const stored = localStorage.getItem(KEY);
let selected = new Set(JSON.parse(stored !== null ? stored : JSON.stringify(SETS.filter(s => s.recommended).map(s => s.id))));
let groupsOn = new Set(Object.keys(SETS.reduce((a,s)=>{a[s.group||""]=1;return a;},{})));

const GL = {"art": "艺术风格", "retro": "复古屏幕", "calm": "安静工作", "care": "护眼阅读"};
function draw() {
  const q = (document.getElementById("q").value || "").toLowerCase();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  let shown = 0;
  for (const s of SETS) {
    if (!groupsOn.has(s.group || "")) continue;
    const hay = (s.id + " " + s.label + " " + (s.group||"") + " " + (GL[s.group||""]||"")
                 + " " + s.hooks.join(" ") + " " + s.source_board).toLowerCase();
    if (q && !hay.includes(q)) continue;
    shown++;
    const el = document.createElement("div");
    el.className = "card" + (selected.has(s.id) ? " selected" : "");
    const c = s.colors;
    el.innerHTML = `
      <div class="swatch">
        <div style="background:${c.canvas}"></div>
        <div style="background:${c.surface}"></div>
        <div style="background:${c.sidebar}"></div>
        <div style="background:${c.text}"></div>
        <div style="background:${c.accent}"></div>
        <div style="background:${c.border}"></div>
      </div>
      <div class="body">
        <div class="label">${s.recommended ? "★ " : ""}${s.label}<small>${s.id}</small></div>
        <div class="row"><span>${GL[s.group||""] || s.group || "未分组"}</span><span>令牌 ${s.tokens}</span><span>结构规则 ${s.rules}</span><span>${s.lines} 行</span></div>
        <div class="hooks">契约钩子：${s.hooks.join(" ") || "（无，纯令牌套组）"}</div>
        <div class="row" style="opacity:.55">来源：${s.source_board || "未注明"}</div>
        ${s.deco.length ? `<div class="deco">装饰槽位 ${s.deco.join(" ")}（默认 none，可挂你自己的图）</div>` : ""}
        <div class="pick"><button data-pick="${s.id}">${selected.has(s.id) ? "已选 ✓" : "选这套"}</button></div>
        <details><summary>看这套的 CSS（${s.lines} 行）</summary><pre>${s.css.replace(/[<>&]/g, m=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[m]))}</pre></details>
      </div>`;
    grid.appendChild(el);
  }
  if (!shown) grid.innerHTML = '<div style="opacity:.6">没有匹配的套组。</div>';
  const list = [...selected];
  document.getElementById("status").textContent = `已选 ${list.length} 套（显示 ${shown} 套）`;
  document.getElementById("cmd").textContent = list.length ? "--only " + list.join(",") : "--only —";
}
const filters = document.getElementById("filters");
for (const g of Object.keys(GL)) {
  const b = document.createElement("div");
  b.className = "chip"; b.dataset.on = "1"; b.textContent = `${GL[g]}（${SETS.filter(s=>(s.group||"")===g).length}）`;
  b.onclick = () => { if (groupsOn.has(g)) groupsOn.delete(g); else groupsOn.add(g); b.dataset.on = groupsOn.has(g) ? "1" : "0"; draw(); };
  filters.appendChild(b);
}
document.addEventListener("click", e => {
  const id = e.target?.dataset?.pick;
  if (!id) return;
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  localStorage.setItem(KEY, JSON.stringify([...selected]));
  draw();
});
document.getElementById("q").oninput = draw;
document.getElementById("clear").onclick = () => { selected.clear(); localStorage.setItem(KEY, "[]"); draw(); };
document.getElementById("copy").onclick = async () => {
  const t = document.getElementById("cmd").textContent;
  try { await navigator.clipboard.writeText(t); document.getElementById("status").textContent = "已复制：" + t; }
  catch { document.getElementById("status").textContent = "复制失败，手动选中：" + t; }
};
draw();
</script></body></html>
